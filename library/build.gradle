apply plugin: 'com.android.library'

android {
    compileSdk 32
    buildToolsVersion "32.0.0"
    defaultConfig {
        minSdk 24
        targetSdk 32
        versionCode 1
        versionName "2.0"
        consumerProguardFiles 'proguard-rules.pro'

        buildConfigField 'boolean', 'MEDIA_DEBUG', 'false'
    }
    buildTypes {
        release {
//            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'library.pro'
        }
    }
}

// 仓库统一由 settings.gradle 的 dependencyResolutionManagement 提供（FAIL_ON_PROJECT_REPOS）
dependencies {
    // 原工程使用 com.android.support:*，移植到 AndroidX 工程后改为 androidx 对应依赖
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.4.1'
}
